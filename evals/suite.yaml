# Karya evaluation suite (plan §14). Ground-truth checks run directly against the
# sandbox databases and the runtime DB, independent of the agent's own verifier.
# Chaos is not part of a scenario: the harness applies profiles from the command line.
# Date tokens like {D+27} resolve against the day the sandbox was seeded.

- id: ap-happy
  request: "Find the latest invoice from Acme Industries in the AP mailbox, enter it into the ERP, and tell me when it's done."
  setup: {reset: true, memory: clear}
  human: {answers: [], approvals: none}
  expect:
    status: [succeeded]
    checks:
      - {type: erp_invoice_count, vendor_id: V001, invoice_number: AI/2026/0917, equals: 1}
      - {type: erp_invoice_fields, vendor_id: V001, invoice_number: AI/2026/0917, amount: "42380.00", invoice_date: "{D-3}", due_date: "{D+27}"}
      - {type: mail_has_label, message_key: M2, label: Processed}
      - {type: questions_asked, equals: 0}

- id: ap-approval-approve
  request: "Process the Vertex Semiconductors invoice in the AP mailbox."
  setup: {reset: true, memory: clear}
  human: {answers: [], approvals: approve, approval_note: "PO 4502 received; OK to post."}
  expect:
    status: [succeeded]
    checks:
      - {type: erp_invoice_count, vendor_id: V003, invoice_number: VS-55120, equals: 1}
      - {type: erp_invoice_fields, vendor_id: V003, invoice_number: VS-55120, amount: "184500.00", invoice_date: "{D-4}", due_date: "{D+41}"}
      - {type: approval_status, status: consumed}
      - {type: mail_has_label, message_key: M4, label: Processed}

- id: ap-approval-reject
  request: "Process the Vertex Semiconductors invoice in the AP mailbox."
  setup: {reset: true, memory: clear}
  human: {answers: [], approvals: reject, reject_reason: "PO not received"}
  expect:
    status: [escalated]
    checks:
      - {type: erp_invoice_count, invoice_number: VS-55120, equals: 0}
      - {type: approval_status, status: rejected}

