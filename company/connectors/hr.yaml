id: hr
name: Meridian People (HR)
kind: web_app
base_url: http://127.0.0.1:8103
purpose: >
  HR system of record. Look up employees; create new employee records; request system
  access and equipment for employees.
auth:
  type: form_login
  login_path: /login
  form_fields: {username: username, password: password}
  credentials: {username_env: HR_AGENT_USER, password_env: HR_AGENT_PASSWORD}
  logged_out_signal: {path_prefix: /login}
volatile_fields: [csrf_token]
blocked_paths: ["/__*"]
actions:
  - name: login
    method: POST
    path: /login
    risk: auth
  - name: logout
    method: POST
    path: /logout
    risk: auth
  - name: create_employee
    method: POST
    path: /employees
    risk: write
    description: Create an employee record.
    fields:
      full_name: {type: str}
      work_email: {type: str}
      start_date: {type: date}
    idempotency_key: [work_email]
    reconcile:
      api: search_employees
      params: {q: "{work_email}"}
      exists_if: non_empty_list
      record_ref_field: id
    display: "Employee {full_name} <{work_email}> starting {start_date}"
  - name: request_access
    method: POST
    path: /employees/{employee_id}/access-requests
    risk: write
    description: Request system access for an employee.
    fields:
      employee_id: {type: str}
      system: {type: str}
      level: {type: str}
    # level is part of the key so "erp viewer" and "erp admin" are distinct requests
    idempotency_key: [employee_id, system, level]
    reconcile:
      api: list_access_requests
      params: {employee_id: "{employee_id}"}
      match: {system: "{system}", level: "{level}"}
      record_ref_field: id
    display: "{level} access to {system} for employee {employee_id}"
  - name: request_equipment
    method: POST
    path: /employees/{employee_id}/equipment
    risk: write
    description: Request equipment for an employee.
    fields:
      employee_id: {type: str}
      item: {type: str}
    idempotency_key: [employee_id, item]
    reconcile:
      api: list_equipment_requests
      params: {employee_id: "{employee_id}"}
      match: {item: "{item}"}
      record_ref_field: id
    display: "{item} for employee {employee_id}"
api:
  auth: {header: X-API-Key, key_env: HR_API_KEY}
  endpoints:
    - {name: search_employees, path: /api/employees, params: [q], description: "Search employees by name, work email or ID."}
    - {name: get_employee, path: "/api/employees/{employee_id}", description: "One employee."}
    - {name: list_access_requests, path: /api/access-requests, params: [employee_id], description: "System-access requests for an employee."}
    - {name: list_equipment_requests, path: /api/equipment-requests, params: [employee_id], description: "Equipment requests for an employee."}
