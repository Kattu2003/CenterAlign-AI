# Invoice PDFs. Totals include 18% GST; the generator back-computes
# subtotal = round(total / 1.18, 2) and GST = total - subtotal, and splits the
# subtotal across the line items (weights) so the lines sum exactly.
#   date_format:   dmy_slash (30/10/2026) | d_mon_y (30 Oct 2026) | iso (2026-10-30) | d_mon_y_dash (30-Oct-2026)
#   amount_format: rs_grouped (Rs. 42,380.00) | inr_plain (INR 18900.00) | inr_grouped (INR 1,84,500.00)
#   layout:        A classic table "Total Payable" | B two-column "Amount Due" | C minimal "Grand Total"
invoices:
  - number: AI/2026/0855
    issuer: V001
    invoice_date: D-38
    due_date: D-8
    total: "38940.00"
    po_number: "4398"
