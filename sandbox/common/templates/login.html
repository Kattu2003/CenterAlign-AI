{% extends "base.html" %}
{% block title %}Sign in — {{ app_title }}{% endblock %}
{% block content %}
{% set d = drift(request) %}
<h1>Sign in</h1>
{% if error %}<p class="banner error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="card form narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="{{ d.id('username') }}">Username</label>
  <input id="{{ d.id('username') }}" name="username" type="text" autocomplete="username" required>
  <label for="{{ d.id('password') }}">Password</label>
  <input id="{{ d.id('password') }}" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">{{ d.button('Sign in') }}</button>
</form>
{% endblock %}
